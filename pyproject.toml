[project]
name = "vtranslate"
version = "0.6.0"
description = "Download a video and dub it into Russian with one voice per speaker, translated by DeepL"
requires-python = ">=3.11,<3.14"
dependencies = [
  "faster-whisper>=1.1",
  "sherpa-onnx>=1.12",
  "edge-tts>=7",
  "piper-tts>=1.3",
  "yt-dlp[default]",
  "deno",
  "huggingface_hub",
  "deepl>=1.20",
  "imageio-ffmpeg>=0.6",
  "av",
  "onnxruntime",
  "numpy",
  "soundfile",
]

[project.scripts]
vtranslate = "vtranslate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtranslate"]
