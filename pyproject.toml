[project]
name = "vtranslate"
version = "0.7.1"
description = "Download a video and dub it into Russian with one voice per speaker, translated by DeepL"
requires-python = ">=3.11,<3.15"
dependencies = [
  "faster-whisper>=1.1",
  "piper-tts>=1.3",
  "yt-dlp[default]",
  "deepl>=1.20",
  "av>=14",
  "onnxruntime",
  "numpy",
]

[project.optional-dependencies]
speakers = ["sherpa-onnx>=1.12"]
online = ["edge-tts>=7"]
youtube = ["deno"]

[project.scripts]
vtranslate = "vtranslate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtranslate"]
